<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter — Gravação</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #07111f;
    --panel: rgba(10, 20, 35, .94);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #ef4444;
  }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  .app { width: 100%; height: 100%; position: relative; background: #000; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
    transform: scaleX(-1);
  }
  .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,.12) 45%, rgba(0,0,0,.55));
  }
  .teleprompter {
    position: absolute; left: 50%; top: 5%;
    transform: translateX(-50%);
    width: min(900px, 88vw);
    height: 58vh;
    overflow: hidden;
    text-align: center;
    pointer-events: none;
    mask-image: linear-gradient(to bottom, transparent 0%, black 13%, black 87%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 13%, black 87%, transparent 100%);
  }
  #script {
    white-space: pre-wrap;
    font-size: 48px;
    line-height: 1.45;
    font-weight: 700;
    text-shadow: 0 3px 12px #000, 0 1px 3px #000;
    padding: 30vh 2vw 60vh;
    transform: translateY(0);
    will-change: transform;
  }
  .guide {
    position: absolute; left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    width: min(900px, 88vw);
    border-top: 2px solid rgba(56,189,248,.65);
    border-bottom: 2px solid rgba(56,189,248,.18);
    height: 145px;
    pointer-events: none;
  }
  .controls {
    position: absolute; z-index: 5; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    width: min(1100px, 95vw);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    padding: 14px;
    backdrop-filter: blur(14px);
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input, textarea { font: inherit; }
  button {
    border: 0; border-radius: 10px; padding: 10px 14px;
    color: white; background: #1e293b; cursor: pointer;
    transition: .15s;
  }
  button:hover { background: #334155; }
  button.primary { background: #0284c7; }
  button.record { background: #dc2626; }
  button.active { outline: 2px solid var(--accent); }
  .control { display: flex; align-items: center; gap: 7px; color: var(--muted); }
  input[type="range"] { width: 130px; accent-color: var(--accent); }
  #status { margin-left: auto; color: var(--muted); font-size: 13px; }
  .editor {
    position: absolute; z-index: 10; inset: 0; display: none;
    background: rgba(2,8,23,.97); padding: 25px;
  }
  .editor.open { display: block; }
  textarea {
    width: 100%; height: calc(100% - 70px); resize: none;
    border: 1px solid #334155; border-radius: 14px;
    background: #0f172a; color: white; padding: 18px;
    font-size: 20px; line-height: 1.5; outline: none;
  }
  .editor-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .timer {
    position:absolute; z-index:4; top:15px; left:15px;
    padding:7px 10px; border-radius:9px;
    background:rgba(0,0,0,.55); font-size:14px;
  }
  .rec-dot { color:#f87171; display:none; }
  body.recording .rec-dot { display:inline; }
  body.recording .controls { border-color: rgba(239,68,68,.5); }
  @media(max-width:700px) {
    #script { font-size: 32px; }
    .teleprompter { width: 94vw; height: 55vh; }
    .guide { width:94vw; }
    #status { width:100%; margin-left:0; }
  }
</style>
</head>
<body>
<div class="app">
  <video id="camera" autoplay muted playsinline></video>
  <div class="shade"></div>

  <div class="timer"><span class="rec-dot">● REC </span><span id="clock">00:00</span></div>

  <div class="teleprompter">
    <div id="script">Olá! Este é o seu teleprompter.

Digite o seu texto no botão “Editar texto”.

Quando estiver pronto, inicie a rolagem e olhe diretamente para a câmera.

Você pode ajustar a velocidade e o tamanho da fonte durante a gravação.</div>
  </div>
  <div class="guide"></div>

  <div class="controls">
    <div class="row">
      <button id="play" class="primary">▶ Iniciar</button>
      <button id="reset">↺ Reiniciar</button>
      <button id="edit">✎ Editar texto</button>
      <button id="fullscreen">⛶ Tela cheia</button>
      <button id="mirror">↔ Espelho</button>
      <button id="record" class="record">● Gravar</button>

      <div class="control">
        Velocidade
        <input id="speed" type="range" min="5" max="120" value="35">
        <span id="speedVal">35</span>
      </div>

      <div class="control">
        Fonte
        <input id="font" type="range" min="24" max="90" value="48">
        <span id="fontVal">48</span>
      </div>

      <span id="status">Câmera iniciando...</span>
    </div>
  </div>

  <div id="editor" class="editor">
    <div class="editor-top">
      <strong>Texto do teleprompter</strong>
      <div>
        <button id="saveText" class="primary">Salvar</button>
        <button id="cancelText">Cancelar</button>
      </div>
    </div>
    <textarea id="textInput"></textarea>
  </div>
</div>

<script>
const camera = document.getElementById('camera');
const script = document.getElementById('script');
const play = document.getElementById('play');
const reset = document.getElementById('reset');
const edit = document.getElementById('edit');
const fullscreen = document.getElementById('fullscreen');
const mirror = document.getElementById('mirror');
const record = document.getElementById('record');
const speed = document.getElementById('speed');
const font = document.getElementById('font');
const speedVal = document.getElementById('speedVal');
const fontVal = document.getElementById('fontVal');
const status = document.getElementById('status');
const editor = document.getElementById('editor');
const textInput = document.getElementById('textInput');
const saveText = document.getElementById('saveText');
const cancelText = document.getElementById('cancelText');
const clock = document.getElementById('clock');

let running = false;
let y = 0;
let last = null;
let mediaRecorder = null;
let chunks = [];
let stream = null;
let recordStart = 0;
let timerInterval = null;
let mirrored = true;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: {ideal: 1920}, height: {ideal: 1080} },
      audio: true
    });
    camera.srcObject = stream;
    status.textContent = 'Câmera pronta';
  } catch (e) {
    status.textContent = 'Permita o acesso à câmera e ao microfone';
    console.error(e);
  }
}

function animate(t) {
  if (running) {
    if (last === null) last = t;
    const dt = Math.min((t - last) / 1000, .05);
    y -= Number(speed.value) * dt;
    const limit = script.scrollHeight - document.querySelector('.teleprompter').clientHeight * .75;
    if (-y >= Math.max(0, limit)) {
      running = false;
      play.textContent = '▶ Iniciar';
      status.textContent = 'Fim do texto';
    }
    script.style.transform = `translateY(${y}px)`;
    last = t;
  } else {
    last = null;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

play.onclick = () => {
  running = !running;
  play.textContent = running ? '⏸ Pausar' : '▶ Iniciar';
  status.textContent = running ? 'Teleprompter rolando...' : 'Pausado';
};

reset.onclick = () => {
  running = false; y = 0;
  script.style.transform = 'translateY(0)';
  play.textContent = '▶ Iniciar';
  status.textContent = 'Texto reiniciado';
};

edit.onclick = () => {
  textInput.value = script.textContent;
  editor.classList.add('open');
  textInput.focus();
};
saveText.onclick = () => {
  script.textContent = textInput.value || 'Digite seu texto aqui.';
  editor.classList.remove('open');
  reset.click();
};
cancelText.onclick = () => editor.classList.remove('open');

speed.oninput = () => speedVal.textContent = speed.value;
font.oninput = () => {
  script.style.fontSize = font.value + 'px';
  fontVal.textContent = font.value;
};

mirror.onclick = () => {
  mirrored = !mirrored;
  camera.style.transform = mirrored ? 'scaleX(-1)' : 'scaleX(1)';
  mirror.classList.toggle('active', mirrored);
};

fullscreen.onclick = async () => {
  if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
};

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

record.onclick = () => {
  if (!stream) {
    status.textContent = 'Câmera ainda não está disponível';
    return;
  }

  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    chunks = [];
    let mime = '';
    if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) mime = 'video/webm;codecs=vp9,opus';
    else if (MediaRecorder.isTypeSupported('video/webm')) mime = 'video/webm';

    mediaRecorder = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);

    mediaRecorder.ondataavailable = e => {
      if (e.data.size) chunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, {type: 'video/webm'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'teleprompter-' + new Date().toISOString().replace(/[:.]/g,'-') + '.webm';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.textContent = 'Gravação salva';
    };

    mediaRecorder.start();
    recordStart = Date.now();
    timerInterval = setInterval(() => clock.textContent = formatTime(Date.now()-recordStart), 250);
    record.textContent = '■ Parar gravação';
    document.body.classList.add('recording');
    status.textContent = 'Gravando...';
  } else {
    mediaRecorder.stop();
    clearInterval(timerInterval);
    record.textContent = '● Gravar';
    document.body.classList.remove('recording');
  }
};

startCamera();
</script>
</body>
</html>
